<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js">
    function startParentQuest() {
        const nameSelect = document.getElementById('gw-name');
        if (nameSelect.selectedIndex <= 0) {
            alert("請選擇孩子的姓名！");
            return;
        }
        const pNameText = nameSelect.options[nameSelect.selectedIndex].text;
        
        const relSelect = document.getElementById('gw-rel');
        let pRel = relSelect.value;
        if (pRel === '其他家人') {
            const otherRel = document.getElementById('gw-rel-other').value.trim();
            pRel = otherRel ? otherRel : '其他家人';
        }
        
        window.currentParentName = pNameText;
        window.currentParentRel = pRel;

        if(!relSelect.value || (relSelect.value === '其他家人' && !document.getElementById('gw-rel-other').value.trim())) {
            alert("請完整填寫您與孩子的關係！");
            return;
        }

        // Hide gateway, show loading
        document.getElementById('parent-gateway').classList.add('hidden');
        document.getElementById('parent-loading').classList.remove('hidden');

        // Simulate network/magic delay
        setTimeout(() => {
            document.getElementById('parent-loading').classList.add('hidden');
            document.getElementById('parent-paper-wrapper').classList.remove('hidden');
            document.getElementById('parent-paper-wrapper').classList.add('animate-unroll');

            // Populate header
            document.getElementById('display-student-info').innerHTML = 
                `<span class="text-slate-600">受測家長：</span> <span class="text-indigo-700">${pNameText} 的 ${pRel}</span>`;
        }, 2000);
    }

    function submitParentExam() {
        const overlay = document.getElementById('grading-overlay');
        
        // Show overlay (flex)
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        
        // Trigger reflow for fade in
        setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);

        // Simulate grading delay (2 seconds)
        setTimeout(() => {
            // Fade out overlay
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }, 300);

            // Scroll to the top of the exam paper
            const paper = document.getElementById('parent-paper-wrapper');
            paper.scrollIntoView({ behavior: 'smooth', block: 'start' });

            // Animate the score stamp after scrolling starts
            setTimeout(() => {
                const scoreBox = document.querySelector('#parent-paper-wrapper .score-box');
                scoreBox.innerText = '85 分'; // Demo score until DB is connected
                
                // Trigger animation
                scoreBox.classList.remove('animate-stamp');
                void scoreBox.offsetWidth; // Reflow hack to restart animation
                scoreBox.classList.add('animate-stamp');
            }, 600); // 0.6s gives enough time for smooth scroll to reach the top

        }, 2000);
    }

    function submitStudentExam() {
        const overlay = document.getElementById('student-saving-overlay');
        const step1 = document.getElementById('student-saving-step1');
        const step2 = document.getElementById('student-saving-step2');
        
        step1.classList.remove('hidden');
        step1.classList.add('flex');
        step2.classList.add('hidden');
        step2.classList.remove('flex');
        step2.classList.remove('scale-100');
        step2.classList.add('scale-95');
        
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);

        const url = "https://script.google.com/macros/s/AKfycby7-ih0pY9ZsJlwUNAPlNmSEA4XAPASjH4oRBxHp6qwJ-VuSryaIISUe6dhIuz-J__n/exec";
        const nameSelect = document.getElementById('st-name');
        const stNameText = (nameSelect && nameSelect.selectedIndex > 0) ? nameSelect.options[nameSelect.selectedIndex].text : "未選擇";
        
        const payload = {
            type: "student",
            classNum: "805",
            studentName: stNameText,
            answers: { status: "已收到交卷！詳細資料收集引擎正在安裝中..." }
        };

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        }).then(() => {
            step1.classList.add('hidden');
            step1.classList.remove('flex');
            step2.classList.remove('hidden');
            step2.classList.add('flex');
            setTimeout(() => {
                step2.classList.remove('scale-95');
                step2.classList.add('scale-100');
            }, 50);
            
            setTimeout(() => {
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                }, 300);
            }, 2000);
        }).catch(err => console.error(err));
    }

    function submitStudentExam() {
        const overlay = document.getElementById('student-saving-overlay');
        const step1 = document.getElementById('student-saving-step1');
        const step2 = document.getElementById('student-saving-step2');
        
        // Reset state
        step1.classList.remove('hidden');
        step1.classList.add('flex');
        step2.classList.add('hidden');
        step2.classList.remove('flex');
        step2.classList.remove('scale-100');
        step2.classList.add('scale-95');
        
        // Show overlay
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);

        // Simulate saving (2s)
        setTimeout(() => {
            // Switch to success
            step1.classList.add('hidden');
            step1.classList.remove('flex');
            
            step2.classList.remove('hidden');
            step2.classList.add('flex');
            setTimeout(() => {
                step2.classList.remove('scale-95');
                step2.classList.add('scale-100');
            }, 10);
        }, 2000);
    }

    function closeStudentSave() {
        const overlay = document.getElementById('student-saving-overlay');
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        setTimeout(() => {
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            
            // Scroll back to top to simulate "resetting" the view
            document.getElementById('content-student').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 300);
    }
</script>
